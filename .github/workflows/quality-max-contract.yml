name: FieldPilot Quality Max Contract
on:
  push:
    branches: ['quality-max-01']
  pull_request:
    branches: ['main', 'feat/locale-first-market-anchor']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run runtime quality targeted contracts
        run: |
          python -m unittest -v \
            skills.fieldpilot.tests.test_runtime_quality_floor_contract \
            skills.fieldpilot.tests.test_prompt_skill_independence_contract \
            skills.fieldpilot.tests.test_narrow_scope_completion_contract \
            skills.fieldpilot.tests.test_market_anchor_contract \
            skills.fieldpilot.tests.test_korea_local_coverage_contract \
            skills.fieldpilot.tests.test_industry_depth_backstop_contract \
            skills.fieldpilot.tests.test_quality_max_contract \
            skills.fieldpilot.tests.test_reference_first_contract \
            skills.fieldpilot.tests.test_lifecycle_decision_router_contract \
            skills.fieldpilot.tests.test_research_receipts_contract
      - name: Run FieldPilot tests
        run: python -m unittest discover -s skills/fieldpilot/tests -p 'test_*.py' -v
      - name: Package skill
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, zipfile
          root = Path('skills/fieldpilot')
          out = Path(os.environ['RUNNER_TEMP']) / 'delivery'
          out.mkdir()
          files = sorted(
              p for p in root.rglob('*')
              if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc'
          )
          zpath = out / 'FieldPilot_quality_max_01.zip'
          with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, 'fieldpilot/' + p.relative_to(root).as_posix())
          manifest = {
              'commit': subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'file_count': len(files),
              'zip_sha256': hashlib.sha256(zpath.read_bytes()).hexdigest(),
              'quality_policy': 'MAXIMIZE_QUALITY_BEFORE_USAGE',
              'behavioral_external_comparison': 'NOT_RUN_ON_THIS_REVISION'
          }
          (out / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fieldpilot-quality-max
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 14
